[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "buildrail"
version = "0.1.0"
description = "Local-first orchestration for pipelines, reusable AI skills, code reviews, documentation generation, and developer workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40,<1",
    "pyyaml>=6.0,<7",
]

[project.scripts]
buildrail = "buildrail.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "pytest>=8.0,<9",
    "types-PyYAML>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/buildrail"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
strict = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra --ignore=tests/live"
